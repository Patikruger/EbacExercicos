<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
    <div class="row">
        <div class="col">
            <h2 class="display-6">Formulário de cadastro</h2>
            <form>
                <label class="form-label " for="nome">Digite seu nome:</label>
                <input class="form-control form-control-md" type="text" id="nome">
                <label class="form-label" for="nome">Digite seu e-mail:</label>
                <input class="form-control form-control-md" type="text" id="email">
                <label class="form-label" for="nome">Digite seu telefone:</label>
                <input class="form-control form-control-md" type="text" id="telefone">
                <div class="form-check form-switch">
                    <label class="form-check-label" for="aceito-termos">Li e concordo com os termos</label>
                    <input class="form-check-input" type="checkbox" id="aceito-termos">
                </div>
                <button class="btn btn-outline-primary">Enviar</button>
               

            </form>
        </div>

    </div>
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
